name: Dependency Updates Check

on:
  workflow_dispatch:

jobs:
  check-dependencies:
    name: Check Dependency Updates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Dependency Updates Check
        run: ./gradlew dependencyUpdates --no-daemon --stacktrace

      - name: Display Summary in Job Summary
        run: |
          REPORT_FILE=$(find build -name "report.txt" | head -n 1)
          if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
            echo "### 📦 Dependency Updates Report" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::No dependency update report.txt found."
          fi

      - name: Upload Dependency Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-updates-report
          path: |
            build/dependencyUpdates/
            build/reports/dependencyUpdates/
          if-no-files-found: ignore

      - name: Send Report to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing. Skipping telegram notification."
            exit 0
          fi

          REPORT_FILE=$(find build -name "report.txt" | head -n 1)
          if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
            curl -s -f -F document=@"$REPORT_FILE" \
                 -F chat_id="$TELEGRAM_CHAT_ID" \
                 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
                 -F caption="📦 *布布密码生成器* 依赖更新检查报告已生成！" \
                 -F parse_mode="Markdown" > /dev/null
            echo "Successfully sent dependency report to Telegram."
          fi
